<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>容器详情标签栏方案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#192238;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:1080px;margin:auto;padding:28px 22px 40px}h1{font-size:23px;margin:0 0 6px}.intro{color:#788398;margin:0 0 24px}.scheme{background:#fff;border:1px solid #e0e5ed;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 6px 24px #26345008}.scheme-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}.scheme-head h2{font-size:17px;margin:0}.scheme-head p{margin:0;color:#7b879a;font-size:13px}.container{border:1px solid #e3e7ee;border-radius:12px;overflow:hidden;background:#fff}.identity{display:flex;align-items:center;gap:12px;padding:18px 20px}.icon{width:40px;height:40px;border:1px solid #dde3ee;border-radius:10px;display:grid;place-items:center;color:#2174ed;background:#f5f8fd}.name{font-size:19px;font-weight:650}.os{color:#8994a5;font-size:12px;margin-top:2px}.status{margin-left:auto;color:#118759;background:#e6f7ef;border-radius:20px;padding:4px 10px;font-size:12px}.status:before{content:"";display:inline-block;width:6px;height:6px;background:#19b57a;border-radius:50%;margin-right:5px}.body{padding:24px 20px;color:#9aa4b3;min-height:58px}.tabs{display:flex;padding:0 20px}.tabs button{font:inherit;border:0;background:none;cursor:default;color:#7e899b;white-space:nowrap}.c .tab-groups button{font:inherit;border:0;background:none;cursor:default;color:#7e899b;white-space:nowrap}.tabs .active{color:#176fdf;font-weight:600}
/* A：等宽分段 */
.a .tabs{padding:0 20px 16px}.a .tab-track{display:grid;grid-template-columns:repeat(6,1fr);width:100%;background:#f2f4f8;padding:4px;border-radius:9px;gap:3px}.a .tabs button{padding:8px 4px;border-radius:6px}.a .tabs .active{background:#fff;box-shadow:0 1px 4px #26345018;color:#263b5b}
/* B：紧凑胶囊 */
.b .tabs{gap:5px;padding:0 20px 16px}.b .tabs button{padding:7px 13px;border-radius:7px}.b .tabs .active{background:#eaf2ff;color:#176fdf}.b .tabs button:not(.active):hover{background:#f5f7fa}
/* C：按任务双行分组 */
.c .tab-groups{display:flex;gap:28px;padding:0 20px 16px}.c .tab-group{min-width:0;flex:1}.c .tab-label{font-size:11px;color:#9aa4b3;margin:0 0 5px 2px;letter-spacing:.04em}.c .group-track{display:flex;gap:3px;background:#f3f5f8;border-radius:8px;padding:3px}.c .group-track button{flex:1;padding:6px 10px;border-radius:5px}.c .group-track .active{background:#fff;box-shadow:0 1px 4px #26345015;color:#176fdf}
@media(max-width:600px){.wrap{padding:18px 12px}.scheme{padding:14px 10px}.scheme-head{display:block}.scheme-head p{margin-top:3px}.identity{padding:15px 14px}.tabs{padding-left:14px!important;padding-right:14px!important}.a .tab-track{gap:1px;padding:3px}.a .tabs button{font-size:13px;padding:8px 2px}.b .tabs{gap:4px;flex-wrap:wrap}.b .tabs button{padding:7px 10px;font-size:13px}.c .tab-groups{padding-left:14px;padding-right:14px;gap:10px}.c .group-track button{padding:6px 4px;font-size:13px}.body{padding:18px 14px}}
</style>
</head>
<body><main class="wrap"><h1>容器详情 · 标签栏方案</h1><p class="intro">同样的六个入口，收紧视觉重量。当前项统一为「资源」。</p>
<section class="scheme a"><div class="scheme-head"><h2>A · 均分分段</h2><p>一整条、六项等宽；最整齐，手机端不需要横向滚动。</p></div><div class="container"><div class="identity"><div class="icon">▣</div><div><div class="name">Lucky</div><div class="os">Alpine Linux v3.22</div></div><div class="status">运行中</div></div><nav class="tabs"><div class="tab-track"><button>概览</button><button>配置</button><button>网络</button><button class="active">资源</button><button>快照</button><button>备份</button></div></nav><div class="body">资源限制</div></div></section>
<section class="scheme b"><div class="scheme-head"><h2>B · 紧凑胶囊</h2><p>选中项是浅蓝底，不用下划线；最接近现有结构，改动最小。</p></div><div class="container"><div class="identity"><div class="icon">▣</div><div><div class="name">Lucky</div><div class="os">Alpine Linux v3.22</div></div><div class="status">运行中</div></div><nav class="tabs"><button>概览</button><button>配置</button><button>网络</button><button class="active">资源</button><button>快照</button><button>备份</button></nav><div class="body">资源限制</div></div></section>
<section class="scheme c"><div class="scheme-head"><h2>C · 双行分组</h2><p>「管理」和「数据」两组，入口有语义；稍多一层视觉信息。</p></div><div class="container"><div class="identity"><div class="icon">▣</div><div><div class="name">Lucky</div><div class="os">Alpine Linux v3.22</div></div><div class="status">运行中</div></div><div class="tab-groups"><div class="tab-group"><div class="tab-label">管理</div><nav class="group-track"><button>概览</button><button>配置</button><button>网络</button><button class="active">资源</button></nav></div><div class="tab-group"><div class="tab-label">数据</div><nav class="group-track"><button>快照</button><button>备份</button></nav></div></div><div class="body">资源限制</div></div></section>
</main></body></html>
