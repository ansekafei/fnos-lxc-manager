<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LXC Manager</title>
<link rel="stylesheet" href="src/styles/tokens.css?v=3317">
<link rel="stylesheet" href="src/styles/base.css?v=3317">
<link rel="stylesheet" href="src/styles/layout.css?v=3317">
</head>
<body>
  <!-- 侧边导航 -->
  <aside class="side">
    <div class="logo"><span class="dot">LX</span>LXC Manager</div>
    <nav class="nav" id="nav">
      <a data-page="dashboard"><span class="ico">▦</span>仪表盘</a>
      <a data-page="containers"><span class="ico">▣</span>容器</a>
      <a data-page="create"><span class="ico">＋</span>创建</a>
      <a data-page="templates"><span class="ico">▤</span>模板</a>
      <a data-page="settings"><span class="ico">⚙</span>设置</a>
      <a data-page="logs"><span class="ico">≡</span>日志</a>
    </nav>
    <div class="foot" id="foot">fnOS</div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <div class="topbar">
      <h1 id="page-title">容器</h1>
      <span class="pill" id="stats-pill" style="display:none"></span>
      <div class="right" id="topbar-right"></div>
    </div>
    <div class="content">
      <!-- 主从双栏：容器页专用 -->
      <div id="master-col" class="master" style="display:none">
        <div id="roster"></div>
      </div>
      <div id="detail-col" class="detail" style="display:none"></div>
      <!-- 独立页面 -->
      <div id="page" class="page" style="display:none"></div>
    </div>
  </div>

  <script type="module" src="src/main.js?v=3317"></script>

  <!-- 启动诊断：模块没跑起来时把原因画在页面上，省得只有一块白屏 -->
  <script>
  (function () {
    var errs = [];
    window.__uiErrs = errs;
    window.addEventListener('error', function (e) {
      var t = e.target || {};
      if (t && (t.src || t.href)) errs.push('资源加载失败：' + (t.src || t.href));
      else errs.push('脚本错误：' + (e.message || e.type) + '（' + (e.filename || '?') + ':' + (e.lineno || 0) + '）');
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      errs.push('Promise 拒绝：' + ((e.reason && e.reason.message) || e.reason));
    });
    document.addEventListener('securitypolicyviolation', function (e) {
      errs.push('CSP 拦截：' + e.violatedDirective + ' → ' + e.blockedURI);
    });

    function probe(url) {
      return fetch(url, { cache: 'no-store' }).then(function (r) {
        return r.text().then(function (t) {
          return url + ' → HTTP ' + r.status + ' · ' + (r.headers.get('content-type') || '无 Content-Type') + ' · ' + t.length + ' 字节'
            + (t.length < 600 ? '\n    内容：' + t.slice(0, 160).replace(/\s+/g, ' ') : '');
        });
      }).catch(function (e) { return url + ' → 请求失败：' + e.message; });
    }

    setTimeout(function () {
      if (window.__uiBooted) return;
      Promise.all([
        probe('src/main.js?probe=' + Date.now()),
        probe('src/styles/base.css?probe=' + Date.now())
      ]).then(function (lines) {
        var d = document.createElement('div');
        d.id = 'boot-diag';
        d.style.cssText = 'position:fixed;z-index:99999;left:0;right:0;top:0;max-height:70vh;overflow:auto;padding:12px 16px;'
          + 'background:#fef2f2;color:#991b1b;border-bottom:2px solid #ef4444;'
          + 'font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap';
        d.textContent = '【启动诊断】界面脚本没跑起来，把这段截图发给开发者\n'
          + '页面：' + location.href + '\n'
          + lines.join('\n') + '\n'
          + (errs.length ? errs.join('\n') : '（没有捕获到任何脚本错误事件）');
        document.body.appendChild(d);
      });
    }, 2000);
  })();
  </script>
</body>
</html>
