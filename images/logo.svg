  <circle cx="92" cy="76" r="6" fill="#f59e0b"/>
  <circle cx="112" cy="76" r="6" fill="#22c55e"/>
  
  <!-- Container Content Lines -->
  <rect x="64" y="108" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="64" y="124" width="120" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="64" y="140" width="100" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="64" y="156" width="60" height="8" rx="4" fill="#94a3b8"/>
  
  <!-- LXC Text -->
  <text x="128" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">LXC</text>
</svg>
