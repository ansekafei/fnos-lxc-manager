      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>
  
  <!-- Container Box -->
  <rect x="48" y="60" width="160" height="140" rx="12" fill="white" fill-opacity="0.95"/>
  
  <!-- Container Header -->
  <rect x="48" y="60" width="160" height="32" rx="12" fill="#1e293b"/>
  <rect x="48" y="80" width="160" height="12" fill="#1e293b"/>
  
  <!-- Container Dots -->
